services:
  - type: web
    name: skelectricals-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ALLOWED_ORIGINS
        value: https://korhycodes.github.io
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: sk-electricals
      - key: MONGODB_COLLECTION
        value: submissions
      - key: RESEND_API_KEY
        sync: false
      - key: NOTIFICATION_EMAIL_TO
        sync: false
      - key: NOTIFICATION_FROM_EMAIL
        sync: false
  - type: static
    name: skelectricals-web
    buildCommand: npm ci && npm run build
    publishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://skelectricals.onrender.com/api
